name: Build Atlas Desk (Android APK)

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-atlas-android-arm64:
    name: Atlas Desk Android (arm64-v8a)
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Inject Atlas branding, self-hosted server and public key
        shell: python
        env:
          ATLAS_SERVER: ${{ secrets.ATLAS_RENDEZVOUS_SERVER }}
          ATLAS_KEY: ${{ secrets.ATLAS_RS_PUB_KEY }}
        run: |
          import os, pathlib, re, sys

          server = os.environ.get("ATLAS_SERVER", "").strip()
          key = os.environ.get("ATLAS_KEY", "").strip()
          if not server or not key:
              print("ERRO: Secrets ATLAS_RENDEZVOUS_SERVER e ATLAS_RS_PUB_KEY sao obrigatorios.", file=sys.stderr)
              sys.exit(1)

          cfg_path = pathlib.Path("libs/hbb_common/src/config.rs")
          text = cfg_path.read_text(encoding="utf-8")
          new_text, n1 = re.subn(
              r'pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*&\[[^\]]+\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];',
              text,
              count=1,
          )
          new_text, n2 = re.subn(
              r'pub const RS_PUB_KEY:\s*&str\s*=\s*"[^"]+";',
              f'pub const RS_PUB_KEY: &str = "{key}";',
              new_text,
              count=1,
          )
          new_text, n3 = re.subn(
              r'pub static ref APP_NAME:\s*RwLock<String>\s*=\s*RwLock::new\("RustDesk"\.to_owned\(\)\);',
              'pub static ref APP_NAME: RwLock<String> = RwLock::new("Atlas Desk".to_owned());',
              new_text,
              count=1,
          )
          if n1 != 1 or n2 != 1 or n3 != 1:
              sys.exit(1)
          cfg_path.write_text(new_text, encoding="utf-8")

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Install prerequisites & cargo-ndk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config nasm libclang-dev
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }}

      - name: Build Android APK (arm64-v8a)
        run: |
          flutter/ndk_arm64.sh || true
          cd flutter
          flutter build apk --release --target-platform android-arm64 --dart-define=ATLAS_MODE=full
          mkdir -p ../AtlasAndroidOutput
          cp build/app/outputs/flutter-apk/app-release.apk ../AtlasAndroidOutput/AtlasDesk-android-arm64.apk
          sha256sum ../AtlasAndroidOutput/AtlasDesk-android-arm64.apk > ../AtlasAndroidOutput/AtlasDesk-android-arm64.apk.sha256

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AtlasDesk-android-arm64
          path: ./AtlasAndroidOutput
          retention-days: 30
