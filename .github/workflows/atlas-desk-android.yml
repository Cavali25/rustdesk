name: Build Atlas Desk (Android APK arm64-v8a)

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-atlas-android-arm64:
    name: Atlas Desk Android APK (arm64-v8a)
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev \
            libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
            libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Inject Atlas branding, self-hosted server and public key
        shell: python
        env:
          ATLAS_SERVER: ${{ secrets.ATLAS_RENDEZVOUS_SERVER }}
          ATLAS_KEY: ${{ secrets.ATLAS_RS_PUB_KEY }}
        run: |
          import os, pathlib, re, sys

          server = os.environ.get("ATLAS_SERVER", "").strip()
          key = os.environ.get("ATLAS_KEY", "").strip()
          if not server or not key:
              print("ERRO: Secrets ATLAS_RENDEZVOUS_SERVER e ATLAS_RS_PUB_KEY sao obrigatorios.", file=sys.stderr)
              sys.exit(1)

          cfg_path = pathlib.Path("libs/hbb_common/src/config.rs")
          text = cfg_path.read_text(encoding="utf-8")
          new_text, n1 = re.subn(
              r'pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*&\[[^\]]+\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];',
              text,
              count=1,
          )
          new_text, n2 = re.subn(
              r'pub const RS_PUB_KEY:\s*&str\s*=\s*"[^"]+";',
              f'pub const RS_PUB_KEY: &str = "{key}";',
              new_text,
              count=1,
          )
          new_text, n3 = re.subn(
              r'pub static ref APP_NAME:\s*RwLock<String>\s*=\s*RwLock::new\("RustDesk"\.to_owned\(\)\);',
              'pub static ref APP_NAME: RwLock<String> = RwLock::new("Atlas Desk".to_owned());',
              new_text,
              count=1,
          )
          if n1 != 1 or n2 != 1 or n3 != 1:
              print(f"ERRO patch config.rs: n1={n1} n2={n2} n3={n3}", file=sys.stderr)
              sys.exit(1)
          cfg_path.write_text(new_text, encoding="utf-8")
          print("Patch Atlas Desk Android aplicado com sucesso.")

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter 3.24.5
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Android vcpkg dependencies (arm64-v8a)
        shell: bash
        run: |
          ./flutter/build_android_deps.sh "arm64-v8a"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android-atlas
          key: aarch64-linux-android

      - name: Build librustdesk.so (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build Atlas Desk Android APK (arm64-v8a)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=ATLAS_MODE=full
          popd
          mkdir -p ./AtlasAndroidOutput
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./AtlasAndroidOutput/AtlasDesk-android-arm64.apk
          sha256sum ./AtlasAndroidOutput/AtlasDesk-android-arm64.apk > ./AtlasAndroidOutput/AtlasDesk-android-arm64.apk.sha256
          ls -lh ./AtlasAndroidOutput/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AtlasDesk-android-arm64
          path: ./AtlasAndroidOutput
          retention-days: 30
