name: Build Atlas Desk (Windows x64 Portable)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante: client (AtlasSuporte.exe), full (AtlasDeskPro.exe) ou both"
        type: choice
        required: true
        default: "both"
        options:
          - both
          - client
          - full

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmostwindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-atlas-desk-x64:
    name: Atlas Desk Windows x64 (${{ matrix.variant.name }})
    needs: [generate-bridge, build-topmostwindow]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { mode: client, name: "Cliente 1-via", exe: "AtlasSuporte", artifact: "AtlasSuporte-windows-x64" }
          - { mode: full,   name: "Pro 2-vias",    exe: "AtlasDeskPro", artifact: "AtlasDeskPro-windows-x64" }
    if: ${{ inputs.variant == 'both' || inputs.variant == matrix.variant.mode }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Inject Atlas branding, self-hosted server and public key
        shell: python
        env:
          ATLAS_SERVER: ${{ secrets.ATLAS_RENDEZVOUS_SERVER }}
          ATLAS_KEY: ${{ secrets.ATLAS_RS_PUB_KEY }}
          ATLAS_APP_NAME: "Atlas Desk"
        run: |
          import os, pathlib, re, sys

          server = os.environ.get("ATLAS_SERVER", "").strip()
          key = os.environ.get("ATLAS_KEY", "").strip()
          app_name = os.environ.get("ATLAS_APP_NAME", "Atlas Desk").strip()
          if not server or not key:
              print("ERRO: Secrets ATLAS_RENDEZVOUS_SERVER e ATLAS_RS_PUB_KEY sao obrigatorios.", file=sys.stderr)
              sys.exit(1)

          cfg_path = pathlib.Path("libs/hbb_common/src/config.rs")
          text = cfg_path.read_text(encoding="utf-8")

          new_text, n1 = re.subn(
              r'pub const RENDEZVOUS_SERVERS:\s*&\[&str\]\s*=\s*&\[[^\]]+\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];',
              text,
              count=1,
          )
          new_text, n2 = re.subn(
              r'pub const RS_PUB_KEY:\s*&str\s*=\s*"[^"]+";',
              f'pub const RS_PUB_KEY: &str = "{key}";',
              new_text,
              count=1,
          )
          new_text, n3 = re.subn(
              r'pub static ref APP_NAME:\s*RwLock<String>\s*=\s*RwLock::new\("RustDesk"\.to_owned\(\)\);',
              f'pub static ref APP_NAME: RwLock<String> = RwLock::new("{app_name}".to_owned());',
              new_text,
              count=1,
          )
          if n1 != 1 or n2 != 1 or n3 != 1:
              print(f"ERRO: Falha ao aplicar patch em config.rs (n1={n1}, n2={n2}, n3={n3})", file=sys.stderr)
              sys.exit(1)

          cfg_path.write_text(new_text, encoding="utf-8")
          print("Patch Atlas Desk aplicado com sucesso em libs/hbb_common/src/config.rs.")

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk custom Flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release/* "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/"

      - name: Patch Flutter 3.24.5
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-atlas-${{ matrix.variant.mode }}

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build Atlas Desk Windows x64 (${{ matrix.variant.mode }})
        env:
          ATLAS_MODE: ${{ matrix.variant.mode }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          Move-Item -Force .\usbmmidd_v2 ./rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Download RustDeskTempTopMostWindow x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted portable executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./AtlasOutput
          OUT_NAME="${{ matrix.variant.exe }}"
          cp ./target/release/rustdesk-portable-packer.exe "./AtlasOutput/${OUT_NAME}.exe"
          sha256sum "./AtlasOutput/${OUT_NAME}.exe" > "./AtlasOutput/${OUT_NAME}.exe.sha256"
          ls -lh "./AtlasOutput/"

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.artifact }}
          path: ./AtlasOutput
          retention-days: 30
